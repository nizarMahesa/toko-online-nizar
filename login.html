<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | MiniShop</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #f5f7ff 0%, #eef3ff 100%);
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
    }

    .auth-card {
      width: min(460px, 100%);
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 28px;
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.08);
      padding: 32px 26px;
    }

    .auth-header {
      margin-bottom: 22px;
      text-align: center;
    }

    .auth-header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.6rem);
      letter-spacing: -0.06em;
    }

    .auth-header p {
      margin: 0;
      color: var(--muted);
    }

    .auth-form {
      display: grid;
      gap: 16px;
    }

    .auth-field {
      display: grid;
      gap: 8px;
    }

    .auth-field label {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .auth-field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }

    .auth-field input:focus {
      border-color: rgba(102, 126, 234, 0.5);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.08);
    }

    .auth-actions {
      display: grid;
      gap: 12px;
      margin-top: 6px;
    }

    .auth-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 12px;
    }

    .auth-note a {
      color: var(--primary);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body data-page="login">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Masuk</h1>
        <p>Silakan masuk untuk lanjut belanja.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="nama@email.com" required />
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Masukkan password" required />
        </div>

        <div class="auth-actions">
          <button type="submit" class="primary-btn">Masuk</button>
          <a href="index.html" class="secondary-btn" style="display:inline-block; text-align:center;">Lanjut ke Toko</a>
        </div>
      </form>

      <p class="auth-note">Belum punya akun? <a href="register.html">Daftar disini</a></p>
    </div>
  </div>

  <div class="toaster" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
