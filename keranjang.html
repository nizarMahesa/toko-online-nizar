<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang Belanja | MiniShop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="cart">
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand" aria-label="Back to catalog">
        <span class="brand-mark">🛍️</span>
        <span>Mini<span style="color: var(--primary);">Shop</span></span>
      </a>
      <nav class="nav-links" aria-label="Navigasi halaman keranjang">
        <a href="index.html">Beranda</a>
        <a href="index.html">Produk</a>
        <a href="keranjang.html" class="active">Keranjang</a>
        <a href="checkout.html">Checkout</a>
      </nav>
      <div class="header-actions">
        <div class="user-pill" style="display:flex; align-items:center; gap:10px;">
          <span class="user-label">Halo, <strong id="userName">Guest</strong></span>
          <button class="secondary-btn" id="loginAction" type="button" style="padding:10px 14px;">Login</button>
          <button class="secondary-btn" id="logoutBtn" type="button" style="padding:10px 14px; display:none;">Logout</button>
        </div>
        <button class="icon-button" type="button" onclick="window.location.href='index.html'" aria-label="Kembali belanja">
          🏠
        </button>
      </div>
    </div>
  </header>

  <main class="page-header">
    <h1 class="page-title">Keranjang <span style="color: var(--primary);">Belanja</span></h1>
    <p class="page-subtitle">Kelola produk yang ingin Anda beli sebelum checkout.</p>
  </main>

  <div class="cart-page-wrap">
    <div class="checkout-layout">
      <div class="cart-page-list" id="cartPageList"></div>

      <aside class="summary-card cart-summary" id="cartSummary">
        <h3>Ringkasan</h3>
        <div class="summary-grid">
          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="cartTotalPage">Rp 0</strong>
          </div>
          <div class="summary-row">
            <span>Ongkir</span>
            <strong>Rp 25.000</strong>
          </div>
          <div class="summary-row total">
            <span>Total Bayar</span>
            <strong id="cartTotalPageTotal">Rp 0</strong>
          </div>
        </div>
        <button type="button" class="primary-btn" id="goCheckout">Lanjut ke Checkout</button>
      </aside>
    </div>
  </div>

  <div class="toaster" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
