<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil & Riwayat | MiniShop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="profile">
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand" aria-label="MiniShop home">
        <span class="brand-mark">🛍️</span>
        <span>Mini<span style="color: var(--primary);">Shop</span></span>
      </a>
      <nav class="nav-links" aria-label="Navigasi profil">
        <a href="index.html">Beranda</a>
        <a href="index.html">Produk</a>
        <a href="keranjang.html">Keranjang</a>
        <a href="checkout.html">Checkout</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button" type="button" onclick="window.location.href='index.html'" aria-label="Kembali ke katalog">🏠</button>
      </div>
    </div>
  </header>

  <main class="page-header">
    <h1 class="page-title">Profil <span style="color: var(--primary);">Pengguna</span></h1>
    <p class="page-subtitle">Kelola akun, wishlist, dan riwayat pesanan Anda.</p>
  </main>

  <div class="checkout-wrap">
    <div class="checkout-layout">
      <section class="form-card">
        <h3>Informasi Akun</h3>
        <div class="summary-grid" id="profileInfo"></div>
      </section>

      <aside class="summary-card cart-summary">
        <h3>Wishlist</h3>
        <div id="wishlistList" class="checkout-list"></div>
      </aside>
    </div>

    <div class="cart-page-wrap" style="padding-top: 12px;">
      <div class="summary-card">
        <h3>Riwayat Pesanan</h3>
        <div id="orderHistory" class="checkout-list" style="margin-top: 18px;"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
